name: Supabase Deploy (Prod)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1

      # Apply migrations using direct DB connection (bypasses pooler auth issues)
      - name: Apply DB migrations (direct DB url)
        run: |
          supabase db push --db-url "postgresql://postgres:${DB_PASSWORD}@db.${PROJECT_ID}.supabase.co:5432/postgres"

      # Deploy Edge Functions only if folder exists
      - name: Deploy Edge Functions (if present)
        run: |
          if [ -d "supabase/functions" ] && [ "$(ls -A supabase/functions 2>/dev/null)" ]; then
            supabase functions deploy --project-ref "$PROJECT_ID"
          else
            echo "No supabase/functions directory - skipping."
          fi
