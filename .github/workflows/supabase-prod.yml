name: Supabase Deploy (Prod)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1

      - name: Apply DB migrations (via session pooler)
        run: supabase db push --db-url "$DB_URL"

      - name: Deploy Edge Functions (if present)
        run: |
          if [ -d "supabase/functions" ] && [ "$(ls -A supabase/functions 2>/dev/null)" ]; then
            supabase functions deploy --project-ref "$PROJECT_ID"
          else
            echo "No supabase/functions directory - skipping."
          fi

