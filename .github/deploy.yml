name: Cleanup, Unzip and Deploy
on:
  push:
    paths:
      - '**.zip' # Reagiert nur, wenn eine ZIP-Datei hochgeladen wird

jobs:
  refresh-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean and Unzip
        run: |
          # 1. ZIP-Name finden
          ZIP_FILE=$(ls *.zip | head -n 1)
          
          # 2. Alles löschen außer .github Ordner und die ZIP selbst
          find . -maxdepth 1 ! -name '.github' ! -name "$ZIP_FILE" ! -name '.' -exec rm -rf {} +
          
          # 3. ZIP entpacken
          unzip -o "$ZIP_FILE" -d ./
          
          # 4. ZIP danach löschen (optional, für sauberes Repo)
          rm "$ZIP_FILE"

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-refresh: Cleared root and extracted new ZIP"
